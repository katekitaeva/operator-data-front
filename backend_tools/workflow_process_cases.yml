name: Process Cases

on:
  push:
    paths:
      - 'inbox/cases/**'
  workflow_dispatch:

jobs:
  process-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process inbox cases and rebuild manifest
        run: |
          python tools/process_cases.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cases/ inbox/
          git diff --staged --quiet || git commit -m "Обработка кейсов и обновление cases/manifest.json"
          git push
